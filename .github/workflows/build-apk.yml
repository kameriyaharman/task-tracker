# Push to main that touches mobile/ → build the Android APK (talks to https://keshavkunj.com/api)
# → publish it as the "apk-latest" GitHub release → re-run the BigRock deploy so
# https://keshavkunj.com/app/ serves the new APK. Replaces the old Railway "keshav-apk" service.
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        working-directory: mobile
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build release APK
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://keshavkunj.com/api
          EXPO_PUBLIC_USE_RN_FETCH: "1"
          EXPO_NO_TELEMETRY: "1"
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false
        run: |
          npx expo prebuild --platform android --no-install --clean
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/keshav.apk"

      - name: Publish as release apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || \
            gh release create apk-latest --title "Keshav Android app (latest)" --notes "Built automatically from main." --latest=false
          gh release upload apk-latest keshav.apk --clobber

      - name: Redeploy keshavkunj.com with the new APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-bigrock.yml --ref main
